<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&amp;family=Inter:wght@500;600;700;800&amp;display=swap');
      .hub-title { font-family: 'Inter', sans-serif; font-weight: 800; font-size: 15px; fill: #FFFFFF; letter-spacing: 0.08em; text-anchor: middle; }
      .hub-sub { font-family: 'JetBrains Mono', monospace; font-size: 9px; fill: #A0A0A0; letter-spacing: 0.12em; text-anchor: middle; }
      .node-title { font-family: 'Inter', sans-serif; font-weight: 700; font-size: 13px; fill: #FFFFFF; letter-spacing: 0.04em; }
      .node-sub { font-family: 'JetBrains Mono', monospace; font-size: 10px; fill: #888888; }
      .tag { font-family: 'JetBrains Mono', monospace; font-size: 9px; fill: #CCCCCC; }
      .mono-meta { font-family: 'JetBrains Mono', monospace; font-size: 10px; fill: #555555; }
      .edge { stroke: #262626; stroke-width: 1.2; stroke-dasharray: 4 4; fill: none; }
      .edge-active { stroke: #444444; stroke-width: 1.2; fill: none; }
      .corner { stroke: #444444; stroke-width: 1; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="960" height="440" fill="#070707" />
  <rect x="1" y="1" width="958" height="438" fill="none" stroke="#1E1E1E" stroke-width="1" />

  <!-- Technical Grid -->
  <line x1="160" y1="0" x2="160" y2="440" stroke="#121212" stroke-width="1" />
  <line x1="480" y1="0" x2="480" y2="440" stroke="#141414" stroke-width="1" />
  <line x1="800" y1="0" x2="800" y2="440" stroke="#121212" stroke-width="1" />
  <line x1="0" y1="110" x2="960" y2="110" stroke="#121212" stroke-width="1" />
  <line x1="0" y1="220" x2="960" y2="220" stroke="#141414" stroke-width="1" />
  <line x1="0" y1="330" x2="960" y2="330" stroke="#121212" stroke-width="1" />

  <!-- Top Metadata Bar -->
  <g transform="translate(30, 24)">
    <text x="0" y="0" class="mono-meta">TOPOLOGY // INTERCONNECTED SYSTEMS ARCHITECTURE</text>
    <text x="720" y="0" class="mono-meta">NODES: 6 // COUPLING: DECENTRALIZED</text>
  </g>

  <!-- Interconnection Lines from Center (480, 220) -->
  <path d="M 480 220 L 330 110 L 250 110" class="edge-active" />
  <path d="M 480 220 L 630 110 L 710 110" class="edge-active" />
  <line x1="400" y1="220" x2="260" y2="220" class="edge-active" />
  <line x1="560" y1="220" x2="700" y2="220" class="edge-active" />
  <path d="M 480 220 L 330 330 L 250 330" class="edge-active" />
  <path d="M 480 220 L 630 330 L 710 330" class="edge-active" />

  <!-- Cross-discipline connection arcs / mesh -->
  <path d="M 250 110 Q 150 220 250 330" class="edge" opacity="0.6" />
  <path d="M 710 110 Q 810 220 710 330" class="edge" opacity="0.6" />
  <path d="M 210 80 Q 480 30 750 80" class="edge" opacity="0.4" />
  <path d="M 210 360 Q 480 410 750 360" class="edge" opacity="0.4" />

  <!-- Center Hub: SYSTEMS THINKING (480, 220) -->
  <g transform="translate(480, 220)">
    <circle r="72" stroke="#222222" stroke-width="1" fill="none" />
    <circle r="60" stroke="#333333" stroke-width="1" stroke-dasharray="2 4" fill="none" />
    
    <rect x="-80" y="-45" width="160" height="90" rx="4" fill="#0F0F0F" stroke="#383838" stroke-width="1.5" />
    
    <circle cx="0" cy="-24" r="3" fill="#FFFFFF" />
    <text x="0" y="-8" class="hub-title">SYSTEMS</text>
    <text x="0" y="8" class="hub-title">THINKING</text>
    <text x="0" y="27" class="hub-sub">CORE INVARIANT</text>

    <!-- Corner ticks -->
    <path d="M -75 -40 L -75 -43 L -72 -43" class="corner" />
    <path d="M 75 -40 L 75 -43 L 72 -43" class="corner" />
    <path d="M -75 40 L -75 43 L -72 43" class="corner" />
    <path d="M 75 40 L 75 43 L 72 43" class="corner" />
  </g>

  <!-- Node 1: AI SYSTEMS (Top Left) -->
  <g transform="translate(30, 45)">
    <rect x="0" y="0" width="220" height="95" rx="3" fill="#0C0C0C" stroke="#262626" stroke-width="1" />
    <circle cx="15" cy="20" r="3" fill="#FFFFFF" />
    <text x="26" y="23" class="node-title">AI SYSTEMS</text>
    <text x="15" y="44" class="node-sub">Quantized Runtimes * Inference</text>
    
    <rect x="15" y="58" width="85" height="18" fill="#141414" stroke="#222222" rx="2" />
    <text x="21" y="70" class="tag">C99 GEMV</text>
    
    <rect x="106" y="58" width="95" height="18" fill="#141414" stroke="#222222" rx="2" />
    <text x="112" y="70" class="tag">PAGED KV CACHE</text>
    <circle cx="210" cy="47" r="2.5" fill="#666666" />
  </g>

  <!-- Node 2: DISTRIBUTED SYSTEMS (Top Right) -->
  <g transform="translate(710, 45)">
    <rect x="0" y="0" width="220" height="95" rx="3" fill="#0C0C0C" stroke="#262626" stroke-width="1" />
    <circle cx="15" cy="20" r="3" fill="#FFFFFF" />
    <text x="26" y="23" class="node-title">DISTRIBUTED</text>
    <text x="15" y="44" class="node-sub">Consensus * Replication * WAL</text>
    
    <rect x="15" y="58" width="92" height="18" fill="#141414" stroke="#222222" rx="2" />
    <text x="21" y="70" class="tag">RAFT PROTOCOL</text>
    
    <rect x="113" y="58" width="92" height="18" fill="#141414" stroke="#222222" rx="2" />
    <text x="119" y="70" class="tag">HLC ORDERING</text>
    <circle cx="10" cy="47" r="2.5" fill="#666666" />
  </g>

  <!-- Node 3: NETWORKING (Mid Left) -->
  <g transform="translate(30, 175)">
    <rect x="0" y="0" width="220" height="90" rx="3" fill="#0C0C0C" stroke="#262626" stroke-width="1" />
    <circle cx="15" cy="20" r="3" fill="#FFFFFF" />
    <text x="26" y="23" class="node-title">NETWORKING</text>
    <text x="15" y="44" class="node-sub">Kernel Bypass * Transport</text>
    
    <rect x="15" y="55" width="85" height="18" fill="#141414" stroke="#222222" rx="2" />
    <text x="21" y="67" class="tag">eBPF / XDP</text>
    
    <rect x="106" y="55" width="95" height="18" fill="#141414" stroke="#222222" rx="2" />
    <text x="112" y="67" class="tag">DPDK ZERO-CPY</text>
  </g>

  <!-- Node 4: INFRASTRUCTURE (Mid Right) -->
  <g transform="translate(710, 175)">
    <rect x="0" y="0" width="220" height="90" rx="3" fill="#0C0C0C" stroke="#262626" stroke-width="1" />
    <circle cx="15" cy="20" r="3" fill="#FFFFFF" />
    <text x="26" y="23" class="node-title">INFRASTRUCTURE</text>
    <text x="15" y="44" class="node-sub">Linux Internals * POSIX Runtimes</text>
    
    <rect x="15" y="55" width="92" height="18" fill="#141414" stroke="#222222" rx="2" />
    <text x="21" y="67" class="tag">MICRO-VMS</text>
    
    <rect x="113" y="55" width="92" height="18" fill="#141414" stroke="#222222" rx="2" />
    <text x="119" y="67" class="tag">CONTAINER OCI</text>
  </g>

  <!-- Node 5: PERFORMANCE (Bottom Left) -->
  <g transform="translate(30, 300)">
    <rect x="0" y="0" width="220" height="95" rx="3" fill="#0C0C0C" stroke="#262626" stroke-width="1" />
    <circle cx="15" cy="20" r="3" fill="#FFFFFF" />
    <text x="26" y="23" class="node-title">PERFORMANCE</text>
    <text x="15" y="44" class="node-sub">Zero Allocation * SIMD Kernels</text>
    
    <rect x="15" y="58" width="95" height="18" fill="#141414" stroke="#222222" rx="2" />
    <text x="21" y="70" class="tag">AVX2 / AVX-512</text>
    
    <rect x="116" y="58" width="85" height="18" fill="#141414" stroke="#222222" rx="2" />
    <text x="122" y="70" class="tag">CACHE-AWARE</text>
  </g>

  <!-- Node 6: SECURITY (Bottom Right) -->
  <g transform="translate(710, 300)">
    <rect x="0" y="0" width="220" height="95" rx="3" fill="#0C0C0C" stroke="#262626" stroke-width="1" />
    <circle cx="15" cy="20" r="3" fill="#FFFFFF" />
    <text x="26" y="23" class="node-title">SECURITY</text>
    <text x="15" y="44" class="node-sub">Memory Safety * Isolation</text>
    
    <rect x="15" y="58" width="92" height="18" fill="#141414" stroke="#222222" rx="2" />
    <text x="21" y="70" class="tag">SANDBOXING</text>
    
    <rect x="113" y="58" width="92" height="18" fill="#141414" stroke="#222222" rx="2" />
    <text x="119" y="70" class="tag">CAPABILITIES</text>
  </g>

  <!-- Bottom Info / Metric -->
  <g transform="translate(30, 422)">
    <text x="0" y="0" class="mono-meta">METHOD: FIRST-PRINCIPLES DECOMPOSITION // VERIFIED INVARIANTS</text>
    <text x="680" y="0" class="mono-meta">DESIGN: STRICT MONOCHROME (NO COLOR ACCENTS)</text>
  </g>
</svg>
