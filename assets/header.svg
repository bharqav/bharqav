<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&amp;family=Inter:wght@400;600;700;800&amp;display=swap');
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; font-weight: 800; font-size: 38px; fill: #FFFFFF; letter-spacing: -0.03em; }
      .role { font-family: 'JetBrains Mono', monospace; font-weight: 500; font-size: 13px; fill: #A0A0A0; letter-spacing: 0.15em; text-transform: uppercase; }
      .subtext { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; font-weight: 400; font-size: 14px; fill: #CCCCCC; }
      .mono { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: #666666; letter-spacing: 0.05em; }
      .mono-light { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: #A0A0A0; }
      .badge-text { font-family: 'JetBrains Mono', monospace; font-size: 10px; fill: #E5E5E5; font-weight: 500; letter-spacing: 0.08em; }
      .grid-line { stroke: #1A1A1A; stroke-width: 1; stroke-dasharray: 4 4; }
      .orbit-line { stroke: #262626; stroke-width: 1; fill: none; }
      .orbit-dashed { stroke: #333333; stroke-width: 1; stroke-dasharray: 3 6; fill: none; }
      .pulse-dot { animation: pulse 3s infinite ease-in-out; }
      @keyframes pulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
    </style>
    <radialGradient id="bgGlow" cx="80%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#141414" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#050505" stop-opacity="1" />
    </radialGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="960" height="320" fill="#050505" />
  <rect width="960" height="320" fill="url(#bgGlow)" />
  <rect x="1" y="1" width="958" height="318" fill="none" stroke="#222222" stroke-width="1" />

  <!-- Background Grid Lines -->
  <line x1="40" y1="0" x2="40" y2="320" class="grid-line" />
  <line x1="280" y1="0" x2="280" y2="320" class="grid-line" />
  <line x1="620" y1="0" x2="620" y2="320" class="grid-line" />
  <line x1="920" y1="0" x2="920" y2="320" class="grid-line" />
  <line x1="0" y1="40" x2="960" y2="40" class="grid-line" />
  <line x1="0" y1="280" x2="960" y2="280" class="grid-line" />

  <!-- Aerospace Vector Elements on Right -->
  <g transform="translate(780, 160)">
    <!-- Concentric Technical Rings -->
    <circle r="130" class="orbit-line" opacity="0.4" />
    <circle r="105" class="orbit-dashed" opacity="0.6" />
    <circle r="75" class="orbit-line" opacity="0.7" />
    <circle r="45" class="orbit-dashed" opacity="0.8" />
    <circle r="18" fill="#111111" stroke="#444444" stroke-width="1.5" />
    <circle r="4" fill="#FFFFFF" class="pulse-dot" />

    <!-- Crosshair axes -->
    <line x1="-140" y1="0" x2="140" y2="0" stroke="#262626" stroke-width="1" />
    <line x1="0" y1="-140" x2="0" y2="140" stroke="#262626" stroke-width="1" />

    <!-- Degree markers -->
    <circle cx="0" cy="-105" r="2.5" fill="#888888" />
    <circle cx="105" cy="0" r="2.5" fill="#888888" />
    <circle cx="0" cy="105" r="2.5" fill="#888888" />
    <circle cx="-105" cy="0" r="2.5" fill="#888888" />

    <!-- Orbital satellite points -->
    <circle cx="53" cy="-53" r="3" fill="#FFFFFF" />
    <line x1="53" y1="-53" x2="70" y2="-70" stroke="#666666" stroke-width="1" />
    <text x="75" y="-72" class="mono" font-size="9" fill="#888888">NODE_01</text>

    <circle cx="-32" cy="67" r="2" fill="#AAAAAA" />
    <line x1="-32" y1="67" x2="-45" y2="80" stroke="#444444" stroke-width="1" />
    <text x="-90" y="84" class="mono" font-size="9" fill="#666666">ORBIT_RNG</text>
  </g>

  <!-- Top Telemetry Bar -->
  <g transform="translate(48, 26)">
    <rect x="0" y="-14" width="6" height="6" fill="#FFFFFF" />
    <text x="14" y="-8" class="mono">SYSTEMS SPEC: AUTONOMOUS_ENG // HOST: PROD</text>
    <text x="450" y="-8" class="mono">SYS_LAT: 0.18ms</text>
    <text x="590" y="-8" class="mono">LOC: 12.9716 N, 77.5946 E [BLR]</text>
    <text x="800" y="-8" class="mono">BUILD: STABLE</text>
  </g>

  <line x1="48" y1="40" x2="912" y2="40" stroke="#222222" stroke-width="1" />

  <!-- Main Hero Typography Content -->
  <g transform="translate(48, 85)">
    <!-- Role badge / Subheader -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="310" height="22" fill="#111111" stroke="#2A2A2A" stroke-width="1" rx="2" />
      <circle cx="10" cy="11" r="3" fill="#FFFFFF" />
      <text x="22" y="15" class="badge-text">TECHNICAL FOUNDER / SYSTEMS ENGINEER</text>
    </g>

    <!-- Name Heading -->
    <text x="0" y="60" class="title">BHARGAV PODAPATI</text>

    <!-- Discipline Pillars -->
    <text x="0" y="92" class="role">SYSTEMS * AI * INFRASTRUCTURE</text>

    <!-- Core Statement -->
    <text x="0" y="125" class="subtext">Building autonomous software engineering systems and baremetal AI infrastructure.</text>
    <text x="0" y="146" class="mono-light">Low-level runtimes, distributed consensus, deterministic systems, and zero-allocation pipelines.</text>
  </g>

  <!-- Capability Chips at bottom -->
  <g transform="translate(48, 252)">
    <!-- Chip 1 -->
    <rect x="0" y="0" width="130" height="26" fill="#0A0A0A" stroke="#222222" stroke-width="1" rx="2" />
    <text x="12" y="17" class="mono-light" font-weight="500">AI SYSTEMS</text>

    <!-- Chip 2 -->
    <rect x="140" y="0" width="170" height="26" fill="#0A0A0A" stroke="#222222" stroke-width="1" rx="2" />
    <text x="152" y="17" class="mono-light" font-weight="500">DISTRIBUTED SYSTEMS</text>

    <!-- Chip 3 -->
    <rect x="320" y="0" width="140" height="26" fill="#0A0A0A" stroke="#222222" stroke-width="1" rx="2" />
    <text x="332" y="17" class="mono-light" font-weight="500">INFRASTRUCTURE</text>

    <!-- Chip 4 -->
    <rect x="470" y="0" width="165" height="26" fill="#0A0A0A" stroke="#222222" stroke-width="1" rx="2" />
    <text x="482" y="17" class="mono-light" font-weight="500">LOW-LEVEL RUNTIMES</text>

    <!-- Right Side Status -->
    <g transform="translate(680, 0)">
      <rect x="0" y="0" width="184" height="26" fill="#111111" stroke="#2A2A2A" stroke-width="1" rx="2" />
      <circle cx="12" cy="13" r="3" fill="#FFFFFF" class="pulse-dot" />
      <text x="24" y="17" class="badge-text">STATUS: ACTIVE COMPILATION</text>
    </g>
  </g>

  <!-- Bottom Coordinates Line -->
  <line x1="48" y1="280" x2="912" y2="280" stroke="#222222" stroke-width="1" />
  <g transform="translate(48, 302)">
    <text x="0" y="0" class="mono">CORE: C99 / C++17 / RUST / LINUX</text>
    <text x="440" y="0" class="mono">PARADIGM: FIRST PRINCIPLES</text>
    <text x="730" y="0" class="mono">SYS_HASH: 0x7F9B4D1A</text>
  </g>

  <!-- Corner Brackets -->
  <path d="M 6 18 L 6 6 L 18 6" stroke="#444444" stroke-width="1.5" fill="none" />
  <path d="M 942 6 L 954 6 L 954 18" stroke="#444444" stroke-width="1.5" fill="none" />
  <path d="M 6 302 L 6 314 L 18 314" stroke="#444444" stroke-width="1.5" fill="none" />
  <path d="M 942 314 L 954 314 L 954 302" stroke="#444444" stroke-width="1.5" fill="none" />
</svg>
