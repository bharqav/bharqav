<svg viewBox="0 0 800 330" xmlns="http://www.w3.org/2000/svg" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="0.6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="wipe">
      <rect x="0" y="0" width="0" height="24">
        <animate attributeName="width" from="0" to="220" dur="0.7s" begin="0.3s" fill="freeze"/>
      </rect>
    </clipPath>
  </defs>

  <rect x="0" y="0" width="800" height="330" rx="10" fill="#0A0E14" stroke="#1A2740" stroke-width="1.5"/>

  <rect x="0" y="0" width="800" height="34" rx="10" fill="#10151F"/>
  <rect x="0" y="24" width="800" height="10" fill="#10151F"/>
  <circle cx="22" cy="17" r="6" fill="#FF5F56"/>
  <circle cx="44" cy="17" r="6" fill="#FFBD2E"/>
  <circle cx="66" cy="17" r="6" fill="#27C93F"/>
  <text x="400" y="22" text-anchor="middle" font-size="13" fill="#8B9BB4">bhargav@systems ~ boot.log</text>

  <g font-size="15" fill="#00D9FF">
    <g clip-path="url(#wipe)">
      <text x="24" y="70" filter="url(#glow)">$ whoami</text>
    </g>

    <text x="24" y="98" fill="#8B9BB4" opacity="0">
      bhargav - systems &amp; ai infrastructure engineer
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.2s" fill="freeze"/>
    </text>

    <text x="24" y="138" opacity="0">
      [ 0.0041 ] quantr-in-c    :: fused simd gemv kernel......... <tspan fill="#3FB950">OK</tspan>
      <animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.8s" fill="freeze"/>
    </text>

    <text x="24" y="164" opacity="0">
      [ 0.0183 ] distributed-kv :: raft leader election........... <tspan fill="#3FB950">OK</tspan>
      <animate attributeName="opacity" values="0;1" dur="0.3s" begin="2.3s" fill="freeze"/>
    </text>

    <text x="24" y="190" opacity="0">
      [ 0.0402 ] openvmm        :: virtio driver_ok negotiated.... <tspan fill="#3FB950">OK</tspan>
      <animate attributeName="opacity" values="0;1" dur="0.3s" begin="2.8s" fill="freeze"/>
    </text>

    <text x="24" y="216" opacity="0">
      [ 0.0779 ] youki          :: cgroups v2 live update......... <tspan fill="#3FB950">OK</tspan>
      <animate attributeName="opacity" values="0;1" dur="0.3s" begin="3.3s" fill="freeze"/>
    </text>

    <text x="24" y="242" opacity="0">
      [ 0.1206 ] hybrid-rag     :: rrf index warm, p99 &lt; 10ms.... <tspan fill="#3FB950">OK</tspan>
      <animate attributeName="opacity" values="0;1" dur="0.3s" begin="3.8s" fill="freeze"/>
    </text>

    <text x="24" y="282" fill="#3FB950" opacity="0">
      status: all systems nominal
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="4.5s" fill="freeze"/>
    </text>

    <text x="24" y="310" filter="url(#glow)" opacity="0">
      $
      <animate attributeName="opacity" values="0;1" dur="0.3s" begin="5.2s" fill="freeze"/>
    </text>
    <rect x="40" y="298" width="9" height="16" fill="#00D9FF" opacity="0">
      <animate attributeName="opacity" values="1;0;1" keyTimes="0;0.5;1" dur="0.8s" begin="5.5s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
